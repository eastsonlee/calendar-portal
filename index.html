<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" id="colorSchemeMeta" />
    <link rel="icon" href="data:," />
    <title>Calendar</title>
    <meta property="og:title" content="Calendar" />
    <meta name="twitter:title" content="Calendar" />
    <meta name="application-name" content="Calendar" />
    <meta name="apple-mobile-web-app-title" content="Calendar" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <script>document.title = "Calendar";</script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700&family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Serif+SC:wght@600;900&display=swap" rel="stylesheet" />
    <style>
      :root{
        --paper:#e6dcc4;
        --sheet:#f2e9d5;
        --cal-bg:#e9dec6;
        --year-bg:#ede4cb;
        --ink:#211609;
        --ink-soft:#3d2f1e;
        --ink-faint:#5b4832;
        --line:#c6b28c;
        --line-soft:#d5c4a0;
        --band:#865736;
        --band-deep:#6f4630;
        --sun:#c05a44;
        --sat:#5f87ad;
        --cn:#b94a38;
        --us:#5f87ad;
        --term:#4c6a3a;
        --lunar:#6b5844;
        --today-bg:#f0c987;
        --today-ink:#2e1c0d;
        --hover:#dcc79e;
        --shadow:0 18px 50px rgba(59,42,25,.22);
        --font-num:"Inter","Noto Sans SC",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
      }
      :root[data-theme="dark"]{
          --paper:#201913;
          --sheet:#2c2318;
          --cal-bg:#382c1e;
          --ink:#fdf3e0;
          --ink-soft:#e6d7bc;
          --ink-faint:#c2ae90;
          --line:#5d4c38;
          --line-soft:#4a3c2c;
          --band:#6d4830;
          --band-deep:#573a26;
          --sun:#efa08d;
          --sat:#93b8d6;
          --cn:#efa08d;
          --us:#93b8d6;
          --term:#bcd6a2;
          --lunar:#d9cbae;
          --today-bg:#eebd7d;
          --today-ink:#2e1a09;
          --year-bg:#423625;
          --hover:#4a3a28;
          --shadow:0 18px 50px rgba(0,0,0,.55);
      }
      *{ box-sizing:border-box; }
      html,body{ height:100%; }
      body{
        margin:0;
        background:var(--paper);
        color:var(--ink);
        font-family:"Noto Sans SC",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
        -webkit-font-smoothing:antialiased;
      }
      button{ font-family:inherit; cursor:pointer; }
      button, [role="button"], select, summary, input:not([type="checkbox"],[type="radio"]){ min-height:2rem; }
      .top-controls{
        position:fixed;
        top:14px;
        right:14px;
        z-index:100;
        display:flex;
        gap:8px;
        align-items:center;
      }
      .theme-toggle{
        display:inline-flex;
        align-items:center;
        gap:7px;
        min-height:40px;
        padding:8px 14px;
        border-radius:999px;
        border:1px solid var(--line);
        background:var(--sheet);
        color:var(--ink);
        box-shadow:0 6px 20px rgba(59,42,25,.18);
        font-size:13.5px;
        font-weight:700;
        letter-spacing:.04em;
        line-height:1;
      }
      .theme-toggle:hover{ background:var(--hover); }
      .theme-toggle:focus-visible{ outline:2px solid var(--band); outline-offset:2px; }
      .theme-toggle .theme-icon{ width:17px; height:17px; flex:none; display:block; }
      .theme-toggle .icon-sun{ display:none; }
      :root[data-theme="dark"] .theme-toggle .icon-sun{ display:block; }
      :root[data-theme="dark"] .theme-toggle .icon-moon{ display:none; }
      .fs-toggle{
        display:inline-flex;
        align-items:center;
        justify-content:center;
        width:40px;
        min-height:40px;
        padding:0;
        border-radius:999px;
        border:1px solid var(--line);
        background:var(--sheet);
        color:var(--ink);
        box-shadow:0 6px 20px rgba(59,42,25,.18);
        line-height:1;
      }
      .fs-toggle:hover{ background:var(--hover); }
      .fs-toggle:focus-visible{ outline:2px solid var(--band); outline-offset:2px; }
      .fs-toggle .fs-icon{ width:17px; height:17px; flex:none; display:block; }
      .fs-toggle .icon-compress{ display:none; }
      .fs-toggle.is-fs .icon-expand{ display:none; }
      .fs-toggle.is-fs .icon-compress{ display:block; }
      .fs-toast{
        position:fixed;
        left:50%;
        bottom:22px;
        transform:translateX(-50%) translateY(8px);
        z-index:120;
        max-width:min(92vw,560px);
        padding:9px 16px;
        border-radius:18px;
        background:rgba(18,10,4,.88);
        color:#fdf6e9;
        font-size:13px;
        font-weight:600;
        line-height:1.45;
        text-align:center;
        box-shadow:0 10px 30px rgba(0,0,0,.35);
        opacity:0;
        pointer-events:none;
        transition:opacity .25s ease, transform .25s ease;
        display:flex;
        align-items:center;
        justify-content:center;
        gap:10px;
        flex-wrap:wrap;
      }
      .fs-toast.show{ opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto; }
      /* True fullscreen (browser granted it): stretch edge to edge. */
      :root:fullscreen .page{ max-width:none; padding:0; height:100dvh; }
      :root:fullscreen .sheet{ border:none; box-shadow:none; }
      :root:-webkit-full-screen .page{ max-width:none; padding:0; height:100dvh; }
      :root:-webkit-full-screen .sheet{ border:none; box-shadow:none; }
      /* In-page fill mode: fallback when the host container (Portal /
         artifact iframe without allowfullscreen) refuses document
         fullscreen. The calendar takes over the whole viewport the
         page is allowed to paint in. */
      :root.pseudo-fs .page{
        position:fixed; inset:0;
        max-width:none; width:100%;
        height:100dvh;
        padding:0;
        z-index:50;
        background:var(--paper);
      }
      :root.pseudo-fs .sheet{ border:none; box-shadow:none; }
      :root.pseudo-fs body{ overflow:hidden; }
      @media (max-width:560px){
        .top-controls{ top:10px; right:10px; }
        .theme-toggle{ min-height:38px; padding:7px 12px; font-size:13px; }
        .fs-toggle{ width:38px; min-height:38px; }
      }

      .page{
        max-width:1760px;
        margin:0 auto;
        padding:clamp(6px,1.1vh,14px) clamp(8px,1.4vw,22px);
        height:100dvh;
        display:flex;
        flex-direction:column;
      }
      @media (min-width:1101px){
        body{ overflow:hidden; }
      }
      /* ---------- desk-calendar sheet ---------- */
      .sheet{
        background:var(--sheet);
        border:1px solid var(--line);
        box-shadow:var(--shadow);
        display:flex;
        flex-direction:column;
        flex:1;
        min-height:0;
      }
      .binding{
        height:16px;
        flex:none;
        background:linear-gradient(var(--band-deep),var(--band-deep));
        position:relative;
        overflow:hidden;
      }
      .binding::before{
        content:"";
        position:absolute; inset:0;
        background-image:radial-gradient(circle at 5px 50%, rgba(0,0,0,.55) 3.2px, rgba(255,255,255,.28) 3.6px, transparent 4.4px);
        background-size:34px 100%;
        background-position:12px 0;
      }
      /* ---------- top: photo + month ---------- */
      .top{
        display:grid;
        grid-template-columns:minmax(0,1.31fr) minmax(0,1fr);
        flex:2.58 1 0;
        min-height:0;
      }
      .photo{
        position:relative;
        overflow:hidden;
        min-height:0;
        background:#3a3128;
      }
      .photo img{
        position:absolute; inset:0;
        width:100%; height:100%;
        object-fit:cover;
        display:block;
      }
      .photo img.layer{ opacity:0; z-index:0; }
      .photo img.layer.show{ opacity:1; z-index:1; }
      @media (prefers-reduced-motion: no-preference){
        .photo img.layer{ transition:opacity .8s ease; }
        .photo img.boot{ animation:fadein .7s ease both; }
        @keyframes fadein{ from{opacity:.25} to{opacity:1} }
      }
      .photo-nav{
        position:absolute;
        top:12px; right:12px;
        z-index:4;
        display:flex;
        gap:6px;
      }
      .photo-swap{
        width:38px; height:38px;
        min-height:38px;
        padding:0;
        display:inline-flex;
        align-items:center;
        justify-content:center;
        border-radius:50%;
        border:1px solid rgba(255,246,230,.38);
        background:rgba(18,10,4,.30);
        color:#fdf6e9;
        line-height:1;
      }
      .photo-swap:hover{ background:rgba(18,10,4,.50); }
      .photo-swap:focus-visible{ outline:2px solid #fdf6e9; outline-offset:2px; }
      .photo-swap svg{ width:18px; height:18px; display:block; }
      @media (max-width:560px){
        .photo-nav{ top:12px; right:10px; }
        .photo-swap{ width:36px; height:36px; min-height:36px; }
      }
      .photo .scrim{
        position:absolute; inset:auto 0 0 0;
        z-index:3;
        padding:96px 18px 14px;
        background:linear-gradient(to top, rgba(18,10,4,.42) 0%, rgba(18,10,4,.20) 42%, rgba(18,10,4,0) 82%);
        color:#fdf6e9;
        display:flex;
        align-items:flex-end;
        justify-content:space-between;
        gap:14px;
        flex-wrap:wrap;
      }
      .today-big{ line-height:1.05; min-width:0; text-shadow:0 1px 10px rgba(10,5,2,.42), 0 0 3px rgba(10,5,2,.35); }
      .clockbox{ min-width:0; }
      .today-big .dow{ font-size:clamp(19px,1.65vw,26px); font-weight:700; letter-spacing:.20em; opacity:.98; margin-bottom:3px; }
      .today-big .dnum{
        font-family:var(--font-num);
        font-weight:700;
        font-size:clamp(52px,5.2vw,92px);
        line-height:.95;
        font-variant-numeric:tabular-nums;
      }
      .today-big .lunar-line{ font-size:clamp(16px,1.35vw,22px); font-weight:600; margin-top:5px; opacity:.98; }
      .today-big .fest-line{ font-size:clamp(15px,1.15vw,19px); margin-top:3px; color:#ffd9a8; font-weight:700; }
      .clockbox{ text-align:right; flex:none; }
      .clockbox .clock{
        font-family:var(--font-num);
        font-weight:700;
        font-size:clamp(54px,4.8vw,78px);
        line-height:.95;
        letter-spacing:.01em;
        font-variant-numeric:tabular-nums;
        text-shadow:0 1px 14px rgba(0,0,0,.45), 0 0 3px rgba(0,0,0,.5);
        white-space:nowrap;
      }
      .clockbox .place{ font-size:clamp(13.5px,1.15vw,17.5px); font-weight:500; opacity:.95; margin-top:7px; text-align:right; text-shadow:0 1px 8px rgba(0,0,0,.45); }
      .sec-toggle{
        margin-top:8px;
        min-height:28px;
        padding:3px 11px;
        border-radius:999px;
        border:1px solid rgba(255,246,230,.38);
        background:rgba(18,10,4,.30);
        color:#fdf6e9;
        font-size:12px;
        font-weight:700;
        letter-spacing:.06em;
        line-height:1;
      }
      .sec-toggle:hover{ background:rgba(18,10,4,.48); }
      .sec-toggle:focus-visible{ outline:2px solid #fdf6e9; outline-offset:2px; }
      /* ---------- month calendar ---------- */
      .month{
        background:var(--cal-bg);
        display:flex;
        flex-direction:column;
        min-width:0;
        min-height:0;
      }
      .month-head{
        background:var(--band);
        color:#fdf6e9;
        /* Right padding reserves room for the fixed top-right
           controls (fullscreen + theme, ~130px wide at the
           viewport's top-right corner) so the ‹ / 今天 / › nav
           sits fully left of them — visible and clickable —
           instead of sliding underneath the button layer. */
        padding:4px 148px 3px 16px;
        display:flex;
        align-items:center;
        gap:10px;
      }
      .month-head .script{
        font-family:var(--font-num);
        font-weight:700;
        font-size:clamp(30px,2.7vw,44px);
        line-height:1.15;
        letter-spacing:.01em;
        padding-right:4px;
        white-space:nowrap;
      }
      .month-head .y-num{
        font-family:var(--font-num);
        font-weight:700;
        font-size:clamp(30px,2.7vw,44px);
        line-height:1.15;
        letter-spacing:.03em;
        font-variant-numeric:tabular-nums;
        white-space:nowrap;
      }
      .nav{ margin-left:auto; display:flex; gap:6px; align-items:center; flex:none; }
      .nav button{
        min-width:40px; min-height:40px;
        border:1px solid rgba(255,246,230,.45);
        background:rgba(255,246,230,.12);
        color:#fdf6e9;
        border-radius:8px;
        font-size:17px;
        line-height:1;
        padding:0 10px;
      }
      .nav button:hover{ background:rgba(255,246,230,.28); }
      .nav button.today-btn{ font-size:13.5px; font-weight:700; letter-spacing:.08em; }
      .week-head, .grid{ display:grid; grid-template-columns:repeat(7,1fr); }
      .week-head{
        padding:2px 6px 6px;
        column-gap:2px;
        border-bottom:1px solid var(--line);
      }
      .week-head span{
        font-family:var(--font-num);
        text-align:center;
        font-size:clamp(13px,1.1vw,18px);
        font-weight:700;
        letter-spacing:.14em;
        color:var(--ink-soft);
      }
      .week-head span small{ display:block; font-size:.78em; letter-spacing:.3em; font-weight:500; color:var(--ink-faint); margin-top:1px; }
      .grid{ flex:1; min-height:0; padding:7px 6px 4px; gap:2px; grid-template-rows:repeat(6,minmax(0,1fr)); }
      .cell{
        border-radius:8px;
        padding:2px 3px 1px;
        display:flex;
        flex-direction:column;
        align-items:center;
        min-height:0;
        min-width:0;
      }
      .cell .num{
        font-family:var(--font-num);
        font-weight:700;
        font-size:clamp(30px,min(2.95vw,4.5vh),50px);
        line-height:.92;
        letter-spacing:.01em;
        font-variant-numeric:tabular-nums;
        flex:none;
      }
      .cell .fest{
        font-size:clamp(12.5px,1vw,15.5px);
        font-weight:700;
        line-height:1.12;
        margin-top:2px;
        white-space:normal;
        overflow-wrap:anywhere;
        max-width:100%;
        width:100%;
        text-align:center;
        color:var(--cn);
      }
      .cell .fest.cn{ color:var(--cn); }
      .cell .fest.us{ font-family:var(--font-num); font-weight:700; color:var(--cn); white-space:nowrap; font-size:clamp(11.5px,.92vw,14px); letter-spacing:-.02em; }
      .cell .fest.term{ color:var(--term); font-weight:500; }
      /* Holidays (CN + US): the date number itself is red — no
         red or blue dot for holidays. Today's circle keeps its
         own ink colour so the number stays readable on it. */
      .cell.hol .num{ color:var(--cn); }
      .cell.today.hol .num{ color:var(--today-ink); }
      /* Solar terms: the only dot on the calendar — a small
         green dot under the date. */
      .cell .term-dot{
        width:7px; height:7px; flex:none;
        border-radius:50%;
        background:var(--term);
        margin-top:4px;
        display:block;
      }
      .cell .lun{
        font-size:clamp(11px,.86vw,13.5px);
        font-weight:600;
        color:var(--lunar);
        line-height:1.12;
        white-space:nowrap;
        margin-top:2px;
        text-align:center;
      }
      .grid.rows-6 .cell .num{ font-size:clamp(26px,min(2.4vw,3.5vh),38px); }
      .grid.rows-6 .cell{ padding-top:1px; padding-bottom:0; }
      .cell.dim{ opacity:.32; }
      :root[data-theme="dark"] .cell.dim{ opacity:.5; }
      /* Today: a background wash on today's cell only — the
         colour is the cell's own background (the bottom layer),
         and the date number, lunar line, festival text and the
         solar-term dot all sit in a layer above it, so nothing
         is covered. (The old circle hung on the number with a
         stacking context above the non-positioned lunar line,
         so its lower half painted over the lunar text.) A
         background cannot change the cell's size, the number's
         box, baseline or the row alignment. */
      .cell.today{ background:var(--today-bg); }
      .cell.today > *{
        position:relative;
        z-index:1;
      }
      .cell.today .num{ color:var(--today-ink); }
      .cell.today .lun{ color:var(--today-ink); opacity:.82; }
      .cell.today .fest{ color:var(--today-ink); }
      .cell:hover{ background:var(--hover); }
      .cell.today:hover{ background:var(--today-bg); }
      /* ---------- year strip ---------- */
      .year-strip{
        border-top:1px solid var(--line);
        padding:5px 14px 6px;
        background:var(--year-bg);
        display:flex;
        flex-direction:column;
        flex:1.42 1 0;
      }
      .year-head{
        display:flex; align-items:center; gap:12px; flex-wrap:wrap;
        margin-bottom:3px;
        flex:none;
      }
      .year-head .y-title{
        font-family:"Noto Serif SC",serif; font-weight:900;
        font-size:clamp(12.5px,.95vw,14.5px);
        letter-spacing:.06em;
        line-height:1.05;
      }
      .year-head .y-title em{
        font-family:var(--font-num); font-style:normal; font-weight:700; color:var(--ink-soft); margin-left:6px; letter-spacing:.04em;
      }
      /* Legend: two dots only — red = holiday, green = solar
         term. The dots live in the legend only; on the calendars
         themselves holidays are red dates (no dot) and solar
         terms carry the green dot alone. */
      .year-legend{
        margin-left:auto;
        display:inline-flex; align-items:center; gap:14px;
        font-size:clamp(11px,.9vw,12.5px);
        font-weight:700;
        color:var(--ink-soft);
        letter-spacing:.05em;
        line-height:1;
      }
      .year-legend .lg-item{ display:inline-flex; align-items:center; gap:5px; }
      .year-legend .lg-dot{ width:9px; height:9px; border-radius:50%; flex:none; display:block; }
      .year-legend .lg-dot.red{ background:var(--cn); }
      .year-legend .lg-dot.green{ background:var(--term); }
      .year-nav{ display:flex; gap:6px; }
      .year-nav button{
        min-width:34px; min-height:18px;
        border:1px solid var(--line);
        background:transparent; color:var(--ink);
        border-radius:8px; font-size:14px; padding:0 9px;
      }
      .year-nav button:hover{ background:var(--hover); }
      .minis{
        display:grid;
        grid-template-columns:repeat(6,1fr);
        gap:6px 12px;
        align-content:start;
        flex:1;
        min-height:0;
      }
      .mini{ cursor:pointer; border-radius:8px; padding:2px 7px 3px; border:1px solid transparent; }
      .mini:hover{ background:var(--hover); }
      .mini h3{
        margin:0;
        padding:0 0 2px;
        line-height:1.2;
        font-size:clamp(11px,1.28vh,12.5px);
        letter-spacing:.08em;
        font-weight:700;
        display:flex; justify-content:space-between; align-items:baseline;
        color:var(--ink);
      }
      .mini h3 .en{ font-family:var(--font-num); font-weight:700; letter-spacing:.08em; font-size:1.04em; }
      .mini table{ width:100%; border-collapse:collapse; font-family:var(--font-num); font-size:clamp(11px,1.32vh,13px); line-height:1.74; font-weight:700; color:var(--ink); font-variant-numeric:tabular-nums; }
      .mini th{ font-weight:700; color:var(--ink-soft); font-size:.78em; padding:0 0 1px; line-height:1.2; }
      .mini td{ text-align:center; padding:0; position:relative; }
      /* Weekends keep the plain ink color; holidays (CN + US) are
         the red dates. Today's circle overrides via its own color
         on .dt, which beats the inherited holiday red. */
      .mini td.hol{ color:var(--cn); }
      .mini td .dt{ position:relative; display:inline-block; min-width:18px; border-radius:50%; }
      .mini td.today .dt{ background:var(--today-bg); color:var(--today-ink); font-weight:700; }
      /* Solar terms in the year strip: a small green dot under
         the date — the only dot used, holidays are red dates. */
      .mini td .term-dot{
        position:absolute;
        left:50%;
        bottom:1px;
        transform:translateX(-50%);
        width:5px; height:5px;
        border-radius:50%;
        background:var(--term);
        display:block;
        pointer-events:none;
      }
      /* ---------- responsive ---------- */
      @media (max-width:1100px){
        .minis{ grid-template-columns:repeat(3,1fr); grid-template-rows:none; flex:none; }
        .page{ height:auto; min-height:100dvh; }
        .year-strip{ flex:none; }
      }
      @media (max-width:820px){
        .page{ min-height:0; }
        .top{ grid-template-columns:1fr; flex:none; }
        .photo{ min-height:250px; aspect-ratio:16/10; }
        .month{ min-height:430px; }
        .grid{ min-height:340px; }
      }
      @media (max-width:560px){
        .minis{ grid-template-columns:repeat(2,1fr); gap:8px 10px; }
        .month-head{ flex-wrap:wrap; padding-right:16px; }
        .nav{ margin-left:0; }
        .cell{ padding:4px 5px 3px; }
        .photo .scrim{ padding:64px 12px 10px; gap:6px; flex-direction:column; align-items:flex-start; }
        .clockbox{ text-align:left; }
        .sec-toggle{ margin-top:6px; }
        .clockbox .clock{ font-size:42px; display:inline-block; margin-right:10px; }
        .clockbox .place{ white-space:normal; text-align:left; display:inline-block; margin-top:0; }
        .today-big .dnum{ font-size:46px; }
      }
      @media (min-width:821px) and (max-height:760px){
        .photo{ min-height:0; }
        .cell .num{ font-size:28px; }

              var hol=(info.cnFest||info.usFest)?" hol":"";
              var termDot=info.term?'<span class="term-dot" aria-hidden="true"></span>':"";
              body+='<td class="'+(isT?"today":"")+hol+'"><span class="dt">'+dn+'</span>'+termDot+'</td>';
            }
            body+="</tr>";
          }
          html+='<div class="mini" data-m="'+m+'" role="button" tabindex="0" aria-label="查看'+(m+1)+'月">'
              +'<h3><span>'+(m+1)+'月 '+MONTH_CN[m]+'</span><span class="en">'+MONTH_EN[m].toUpperCase()+'</span></h3>'
              +'<table><tr><th>M</th><th>T</th><th>W</th><th>T</th><th>F</th><th>S</th><th>S</th></tr>'+body+'</table></div>';
        }
        minisEl.innerHTML=html;
        var nodes=minisEl.querySelectorAll(".mini");
        for(var i=0;i<nodes.length;i++){
          (function(el){
            function go(){ viewM=parseInt(el.getAttribute("data-m"),10); followToday=false; renderMain(); markCurrentMini(); window.scrollTo({top:0,behavior:"smooth"}); }
            el.addEventListener("click",go);
            el.addEventListener("keydown",function(e){ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); go(); } });
          })(nodes[i]);
        }
      }
      function markCurrentMini(){
        /* current month is intentionally not highlighted in the year strip */
      }
      function renderTodayPanel(){
        var t=new Date();
        var info=dayInfo(t);
        document.getElementById("todayDow").textContent=(t.getMonth()+1)+"月 · "+DOW_CN[t.getDay()];
        document.getElementById("todayNum").textContent=t.getDate();
        document.getElementById("todayLunar").textContent="农历"+info.lunar.monthName+info.lunar.dayLabel+" · "+ganzhi(info.lunar.y);
        var f=[];
        if(info.cnFest) f.push(info.cnFest);
        if(info.usFest) f.push(info.usFest);
        if(info.term) f.push(info.term);
        document.getElementById("todayFest").textContent=f.join(" · ");
      }
      var showSeconds=false;
      var secToggle=document.getElementById("secToggle");
      if(secToggle){
        secToggle.addEventListener("click",function(){
          showSeconds=!showSeconds;
          secToggle.setAttribute("aria-pressed", showSeconds?"true":"false");
          secToggle.textContent=showSeconds?"隐藏秒数":"显示秒数";
          tickClock();
        });
      }
      function tickClock(){
        var t=new Date();
        var hh=String(t.getHours()).padStart(2,"0"), mm=String(t.getMinutes()).padStart(2,"0"), ss=String(t.getSeconds()).padStart(2,"0");
        document.getElementById("clock").textContent=showSeconds ? (hh+":"+mm+":"+ss) : (hh+":"+mm);
        var key=t.getFullYear()+"-"+t.getMonth()+"-"+t.getDate();
        if(key!==todayKey){
          todayKey=key;
          renderPhoto(true);
          warmPhotoCache();
          renderTodayPanel();
          if(followToday){ viewY=t.getFullYear(); viewM=t.getMonth(); renderMain(); renderMinis(); }
          else { renderMain(); renderMinis(); }
        }
        /* Month rollover: the whole batch swaps to the new month's
           30 photos; re-anchor the wall and restart the countdown. */
        var monthNow=t.getMonth();
        if(monthNow!==photoMonthKey){
          photoMonthKey=monthNow;
          photoIdx=GALLERY[monthNow].indexOf(dailyPhoto(t));
          photoLastAdvance=Date.now();
          renderPhoto(true);
          warmPhotoCache();
        }
        /* Photo wall: advance one photo every minute. Driven from
           this per-second tick with a timestamp rather than a bare
           timer, so a swap missed while the display slept still
           happens as soon as the page wakes. */
        if(Date.now()-photoLastAdvance>=AUTO_PHOTO_MS){
          photoLastAdvance=Date.now();
          photoIdx++;
          renderPhoto(true);
        }
        /* Backstop, checked every second: if a midnight swap ever
           failed or was missed while timers were suspended, keep
           retrying until the photo on screen matches today's pick. */
        renderPhoto();
      }
      function shiftMonth(delta){
        viewM+=delta;
        if(viewM<0){ viewM=11; viewY--; renderMinis(); }
        if(viewM>11){ viewM=0; viewY++; renderMinis(); }
        followToday=false;
        renderMain(); markCurrentMini();
      }
      document.getElementById("photoPrev").addEventListener("click",function(){
        photoIdx--;
        photoLastAdvance=Date.now();
        renderPhoto(true);
      });
      document.getElementById("photoNext").addEventListener("click",function(){
        photoIdx++;
        photoLastAdvance=Date.now();
        renderPhoto(true);
      });
      document.getElementById("prevM").addEventListener("click",function(){ shiftMonth(-1); });
      document.getElementById("nextM").addEventListener("click",function(){ shiftMonth(1); });
      document.getElementById("goToday").addEventListener("click",function(){
        var t=new Date(); viewY=t.getFullYear(); viewM=t.getMonth(); followToday=true;
        renderMain(); renderMinis(); renderTodayPanel();
      });
      document.getElementById("prevY").addEventListener("click",function(){ viewY--; followToday=false; renderMain(); renderMinis(); });
      document.getElementById("nextY").addEventListener("click",function(){ viewY++; followToday=false; renderMain(); renderMinis(); });
      window.addEventListener("resize",function(){ fitFestNames(); });
      /* Timers can be suspended while an always-on display sleeps;
         re-check the date and photo as soon as the page wakes. */
      document.addEventListener("visibilitychange",function(){ if(!document.hidden) tickClock(); });
      window.addEventListener("focus",function(){ tickClock(); });
      window.addEventListener("pageshow",function(){ tickClock(); });
      if(document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ fitFestNames(); });
      document.addEventListener("keydown",function(e){
        if(e.key==="ArrowLeft") shiftMonth(-1);
        else if(e.key==="ArrowRight") shiftMonth(1);
      });

      renderPhoto();
      renderTodayPanel();
      renderMain();
      renderMinis();
      tickClock();
      setTimeout(warmPhotoCache,2500);
      setInterval(tickClock,1000);
    })();
    </script>
  </body>
</html>
